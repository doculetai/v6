function buildPhoneInput(container, defaultVal) {
  var wrap = el('div', 'phone-wrap');
  var selected = COUNTRIES[0]; // Nigeria

  var ccBtn = el('button', 'cc-btn');
  ccBtn.type = 'button';
  var flagSpan = txt(el('span', 'cc-flag'), selected.flag);
  var codeSpan = txt(el('span', 'cc-code'), selected.code);
  var chevron = el('span', 'cc-chevron');
  chevron.innerHTML = '<svg viewBox="0 0 10 6" fill="none"><path d="M1 1l4 4 4-4" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>';
  ccBtn.appendChild(flagSpan); ccBtn.appendChild(codeSpan); ccBtn.appendChild(chevron);

  var dropdown = el('div', 'cc-dropdown');
  var searchWrap = el('div', 'cc-search');
  var searchInput = el('input'); searchInput.placeholder = 'Search country...'; searchInput.type = 'text';
  searchWrap.appendChild(searchInput);
  dropdown.appendChild(searchWrap);
  var ccList = el('div', 'cc-list');

  function renderCountries(filter) {
    while (ccList.firstChild) ccList.removeChild(ccList.firstChild);
    COUNTRIES.filter(function(c) {
      return !filter || c.name.toLowerCase().indexOf(filter.toLowerCase()) > -1;
    }).forEach(function(c) {
      var opt = el('div', 'cc-option' + (c === selected ? ' selected' : ''));
      opt.appendChild(txt(el('span', 'cc-option-flag'), c.flag));
      opt.appendChild(txt(el('span', 'cc-option-name'), c.name));
      opt.appendChild(txt(el('span', 'cc-option-code'), c.code));
      opt.addEventListener('click', function() {
        selected = c;
        flagSpan.textContent = c.flag;
        codeSpan.textContent = c.code;
        dropdown.classList.remove('open');
        renderCountries('');
      });
      ccList.appendChild(opt);
    });
  }
  renderCountries('');
  dropdown.appendChild(ccList);
  searchInput.addEventListener('input', function() { renderCountries(searchInput.value); });

  ccBtn.addEventListener('click', function(e) {
    e.stopPropagation();
    dropdown.classList.toggle('open');
  });
  document.addEventListener('click', function() { dropdown.classList.remove('open'); }, { capture: true, once: false });

  var numInput = el('input', 'phone-number-input');
  numInput.type = 'tel'; numInput.placeholder = '801 234 5678';
  if (defaultVal) numInput.value = defaultVal;

  wrap.appendChild(ccBtn); wrap.appendChild(dropdown); wrap.appendChild(numInput);
  container.appendChild(wrap);
}

function buildSchoolSearch(container, onSelect) {
  var wrap = el('div', 'school-wrap');
  var inputRow = el('div', 'school-input-row');
  var icon = el('span', 'school-search-icon');
  icon.innerHTML = '<svg viewBox="0 0 16 16" fill="none"><circle cx="7" cy="7" r="4.5" stroke="currentColor" stroke-width="1.4"/><path d="M10.5 10.5L13 13" stroke="currentColor" stroke-width="1.4" stroke-linecap="round"/></svg>';
  inputRow.appendChild(icon);
  var inp = el('input', 'form-input');
  inp.placeholder = 'Search for your school...'; inp.type = 'text';
  inputRow.appendChild(inp);
  wrap.appendChild(inputRow);

  var dropdown = el('div', 'school-dropdown');
  function renderSchools(filter) {
    while (dropdown.firstChild) dropdown.removeChild(dropdown.firstChild);
    var filtered = SCHOOLS.filter(function(s) {
      return !filter || s.name.toLowerCase().indexOf(filter.toLowerCase()) > -1 || s.abbr.toLowerCase().indexOf(filter.toLowerCase()) > -1;
    });
    filtered.forEach(function(s) {
      var opt = el('div', 'school-option');
      opt.appendChild(txt(el('div', 'school-option-name'), s.name));
      opt.appendChild(txt(el('div', 'school-option-abbr'), s.abbr));
      opt.addEventListener('click', function() {
        inp.value = s.name;
        dropdown.classList.remove('open');
        if (onSelect) onSelect(s);
      });
      dropdown.appendChild(opt);
    });
    if (!filtered.length) {
      dropdown.appendChild(txt(el('div', 'school-option td-muted'), 'No schools found'));
    }
  }
  inp.addEventListener('input', function() {
    if (inp.value.length > 0) { renderSchools(inp.value); dropdown.classList.add('open'); }
    else { dropdown.classList.remove('open'); }
  });
  inp.addEventListener('focus', function() {
    if (inp.value.length > 0) { renderSchools(inp.value); dropdown.classList.add('open'); }
  });
  document.addEventListener('click', function(e) {
    if (!wrap.contains(e.target)) dropdown.classList.remove('open');
  });
  wrap.appendChild(dropdown);
  container.appendChild(wrap);
}

      var chips = el('div', 'template-chips');

        { label: 'Balance insufficient',  text: 'The balance shown does not meet the minimum proof of funds requirement.' },
        { label: 'Statement outdated',    text: 'This bank statement is more than 3 months old. Please provide a recent statement.' },
        { label: 'Name mismatch',         text: 'The account name on this statement does not match your registered name.' },

      ];
      var ta = el('textarea', 'form-input');
      ta.rows = 3; ta.placeholder = 'State the failure, the reason, and the required action. Be precise.';

      var counter = el('div', 'char-counter');
      counter.textContent = '0 / 280';

      templates.forEach(function(tpl) {
        var chip = el('button', 'template-chip');

          chips.querySelectorAll('.template-chip').forEach(function(c) { c.classList.remove('selected'); });

        });

      });

      ta.addEventListener('input', function() {
        chips.querySelectorAll('.template-chip').forEach(function(c) { c.classList.remove('selected'); });

        counter.textContent = len + ' / 280';
        if (len > 280) { counter.classList.add('over-limit'); } else { counter.classList.remove('over-limit'); }
      });

      g.appendChild(chips);
      g.appendChild(ta);
      g.appendChild(counter);
      body.appendChild(g);

    /* Error state — wrong OTP, show error message + resend button with cooldown */
    if (isError) {
      var errBadge = el('div'); errBadge.style.marginTop = '8px';
      errBadge.appendChild(txt(el('span', 'badge badge-red'), 'Verification failed \u2014 retry required'));
      body.appendChild(errBadge);

      if (tier.detail) {
        var errMsg = txt(el('div', 'tier-error-msg'), tier.detail);
        body.appendChild(errMsg);
      }

      (function(tierRef) {
        var cooldownSec = tierRef.cooldown || 30;
        var resendBtn = el('button', 'resend-btn');
        resendBtn.disabled = true;
        var countdownSpan = txt(el('span', 'resend-countdown'), '0:' + (cooldownSec < 10 ? '0' : '') + cooldownSec);
        resendBtn.appendChild(document.createTextNode('Resend in\u00a0'));
        resendBtn.appendChild(countdownSpan);
        body.appendChild(resendBtn);

        var remaining = cooldownSec;
        var timer = setInterval(function() {
          remaining -= 1;
          if (remaining <= 0) {
            clearInterval(timer);
            resendBtn.disabled = false;
            resendBtn.innerHTML = '';
            resendBtn.textContent = tierRef.actionLabel || 'Resend code';
            resendBtn.addEventListener('click', function() { showPhoneVerifyModal(); });
          } else {
            countdownSpan.textContent = '0:' + (remaining < 10 ? '0' : '') + remaining;
          }
        }, 1000);
      })(tier);
    }

    /* Rejected state — show admin note + resubmit */
    if (isRejected) {
      var rejBadge = el('div'); rejBadge.style.marginTop = '8px';
      rejBadge.appendChild(txt(el('span', 'badge badge-red'), 'Rejected \u2014 action required'));
      body.appendChild(rejBadge);
      if (tier.rejectionNote) {
        var rejCard = el('div', 'rejection-card');
        rejCard.appendChild(txt(el('div', 'rejection-card-head'), 'Admin note'));
        rejCard.appendChild(txt(el('div', 'rejection-card-note'), tier.rejectionNote));
        var resubBtn = el('button', 'rejection-resubmit');
        resubBtn.textContent = tier.action || 'Resubmit statement';
        rejCard.appendChild(resubBtn);
        body.appendChild(rejCard);
      }
    }

    /* T3 choice state — two equal cards */
    if (isT3Choice) {
      var choiceGrid = el('div', 't3-choice-grid');

      var monoCard = el('div', 't3-choice-card');
      var monoIcon = el('div', 't3-choice-icon');
      monoIcon.appendChild(svgIcon('<path d="M3 6h18v2H3V6zm0 5h18v2H3v-2zm0 5h18v2H3v-2z" fill="currentColor"/>'));
      monoCard.appendChild(monoIcon);
      monoCard.appendChild(txt(el('div', 't3-choice-title'), 'Connect your bank'));
      monoCard.appendChild(txt(el('div', 't3-choice-desc'), 'Authorise Mono to pull your balance securely. Result is instant.'));
      monoCard.appendChild(txt(el('span', 't3-choice-tag instant'), 'Instant result'));
      choiceGrid.appendChild(monoCard);

      var uploadCard = el('div', 't3-choice-card');
      var uploadIcon = el('div', 't3-choice-icon');
      uploadIcon.appendChild(svgIcon('<path d="M14 2H6a2 2 0 00-2 2v16a2 2 0 002 2h12a2 2 0 002-2V8l-6-6z" stroke="currentColor" stroke-width="1.5" fill="none"/><path d="M14 2v6h6" stroke="currentColor" stroke-width="1.5" fill="none"/>'));
      uploadCard.appendChild(uploadIcon);
      uploadCard.appendChild(txt(el('div', 't3-choice-title'), 'Upload bank statement'));
      uploadCard.appendChild(txt(el('div', 't3-choice-desc'), 'Upload a recent PDF or image of your statement. Goes to admin review.'));
      uploadCard.appendChild(txt(el('span', 't3-choice-tag review'), 'Admin review'));
      choiceGrid.appendChild(uploadCard);

      body.appendChild(choiceGrid);
    }

    /* OCR review state — extracted data before submission */
    if (isOcrReview && tier.ocrData) {
      var ocrCard = el('div', 'ocr-card');
      ocrCard.appendChild(txt(el('div', 'ocr-card-head'), 'CONFIRM YOUR DETAILS'));
      tier.ocrData.forEach(function(field) {
        var row = el('div', 'ocr-field-row');
        row.appendChild(txt(el('div', 'ocr-field-label'), field.label));
        row.appendChild(txt(el('div', 'ocr-field-value'), field.value));
        row.appendChild(txt(el('div', 'ocr-field-edit'), 'Edit'));
        ocrCard.appendChild(row);
      });
      var confirmRow = el('div', 'ocr-confirm-row');
      confirmRow.appendChild(txt(el('button', 'btn-primary'), 'Confirm and submit'));
      confirmRow.appendChild(txt(el('button', 'btn-ghost'), 'Edit details'));
      ocrCard.appendChild(confirmRow);
      body.appendChild(ocrCard);
    }

    card.appendChild(iconWrap);
    card.appendChild(body);
    main.appendChild(card);
  });
}

function renderOpsQueue(page, main) {
  if (page.stats) main.appendChild(buildStatGrid(page.stats, 4));

  /* Build filter bar above the queue card */
  var filterBar = el('div', 'filter-bar');
  var filterDefs = [
    { label:'All',       key:'all'       },
    { label:'Documents', key:'documents' },
    { label:'Banking',   key:'banking'   },
    { label:'Cert ready',key:'cert_ready'},
  ];
  filterDefs.forEach(function(f) {
    var chip = el('button', 'filter-chip' + (f.key === 'all' ? ' active' : ''));
    chip.textContent = f.label;
    chip.dataset.filter = f.key;
    filterBar.appendChild(chip);
  });
  main.appendChild(filterBar);

  var scard = el('div', 'section-card');
  var sh = el('div', 'section-header');
  sh.appendChild(txt(el('span', 'section-title'), 'Review queue \u2014 FIFO'));

  /* State overrides use page.items (rich format); base data uses page.queue (simple format) */
  var items = page.items || page.queue || [];
  sh.appendChild(txt(el('span', 'td-muted'), String(items.length) + ' items'));
  scard.appendChild(sh);

  var allRows = [];

  items.forEach(function(item) {
    var row = el('div');
    row.style.cssText = 'padding:14px 16px;border-bottom:1px solid rgba(0,0,0,0.05);';
    /* Assign data-category for filter chips */
    var cat = item.category || (item.status === 'cert_ready' ? 'cert_ready' : 'documents');
    row.dataset.category = cat;

    var top = el('div'); top.style.cssText = 'display:flex;align-items:center;gap:12px;margin-bottom:10px;';

    /* Rich format: initials avatar + student name + school */
    if (item.initials) {
      var av = el('div', 'user-av'); av.textContent = item.initials;
      av.style.cssText = 'width:34px;height:34px;border-radius:50%;background:var(--accent);color:#fff;display:flex;align-items:center;justify-content:center;font-size:12px;font-weight:600;flex-shrink:0;';
      top.appendChild(av);
    }

    var nameDiv = el('div'); nameDiv.style.flex = '1';
    /* Rich format uses item.student + item.type; simple uses item.name + item.doc */
    nameDiv.appendChild(txt(el('div'), item.student || item.name));
    var detailLine = item.detail || item.doc;
    if (item.school) detailLine = (item.type || '') + ' \u00b7 ' + item.school;
    var docSpan = txt(el('div', 'td-muted'), detailLine);
    docSpan.style.marginTop = '2px';
    nameDiv.appendChild(docSpan);

    if (item.amount) {
      var amtSpan = txt(el('div'), item.amount);
      amtSpan.style.cssText = 'font-family:var(--font-mono);font-size:13px;color:var(--accent);margin-top:2px;';
      nameDiv.appendChild(amtSpan);
    }

    if (item.wait) {
      var waitDiv = txt(el('div', 'td-muted'), 'Wait: ' + item.wait);
      waitDiv.style.flexShrink = '0';
      top.appendChild(nameDiv); top.appendChild(txt(el('div', 'td-muted'), item.submitted)); top.appendChild(waitDiv);
    } else {
      top.appendChild(nameDiv);
    }

    /* cert_ready status — green issue button, no reject */
    if (item.status === 'cert_ready') {
      var certRow = el('div', 'ops-action-row');
      var readyBadge = el('span', 'badge badge-green'); readyBadge.textContent = 'All checks passed';
      var issueBtn = el('button', 'btn-approve'); issueBtn.textContent = 'Issue certificate';
      certRow.appendChild(readyBadge); certRow.appendChild(issueBtn);
      row.appendChild(top); row.appendChild(certRow);
    } else {
      var btnRow = el('div', 'ops-action-row');
      var approveBtn = el('button', 'btn-approve'); approveBtn.textContent = 'Approve';
      var rejectBtn  = el('button', 'btn-reject');  rejectBtn.textContent  = 'Reject';
      var infoBtn    = el('button', 'btn-moreinfo'); infoBtn.textContent   = 'Request info';
      approveBtn.addEventListener('click', function() { showAdminReviewModal('approve', item); });
      rejectBtn.addEventListener('click',  function() { showAdminReviewModal('reject', item); });
      infoBtn.addEventListener('click',    function() { showAdminReviewModal('info', item); });
      btnRow.appendChild(approveBtn); btnRow.appendChild(rejectBtn); btnRow.appendChild(infoBtn);

      /* Show rejection draft inline when present */
      if (item.rejectionDraft) {
        var draftNote = el('div', 'rejection-card');
        draftNote.style.marginTop = '10px';
        draftNote.appendChild(txt(el('div', 'rejection-card-head'), 'DRAFT REJECTION NOTE'));
        draftNote.appendChild(txt(el('div', 'rejection-card-note'), item.rejectionDraft));
        row.appendChild(top); row.appendChild(btnRow); row.appendChild(draftNote);
      } else {
        row.appendChild(top); row.appendChild(btnRow);
      }
    }

    scard.appendChild(row);
    allRows.push(row);
  });
  main.appendChild(scard);

  /* Wire filter chips — runs after scard is in main so rows are in DOM */
  var filterChips = filterBar.querySelectorAll('.filter-chip');
  function applyFilter(selected) {
    filterChips.forEach(function(c) { c.classList.toggle('active', c.dataset.filter === selected); });
    allRows.forEach(function(r) {
      r.style.display = (selected === 'all' || r.dataset.category === selected) ? '' : 'none';
    });
  }
  filterChips.forEach(function(chip) {
    chip.addEventListener('click', function() { applyFilter(chip.dataset.filter); });
  });
}

function renderPage(roleId, label) {
  currentNavLabel = label;
  var page = getPage(roleId, label);

  document.getElementById('topbarTitle').textContent = label;
  var main = document.getElementById('mainContent');
  while (main.firstChild) main.removeChild(main.firstChild);

  if (page.eyebrow) main.appendChild(txt(el('div', 'page-eyebrow'), page.eyebrow));
  main.appendChild(txt(el('h1', 'page-h1'), page.h1));

  var t = page.type;
  if      (t === 'settings')           renderSettings(page, main);
  else if (t === 'apikeys')            renderApiKeys(page, main);
  else if (t === 'onboarding-form')    renderOnboardingForm(page, main);
  else if (t === 'verification-tiers') renderVerificationTiers(page, main);
  else if (t === 'documents-upload')   renderDocumentsUpload(page, main);
  else if (t === 'ops-queue')          renderOpsQueue(page, main);
  else if (t === 'commitments')        renderCommitments(page, main);
  else if (t === 'cert-issued')        renderCertIssued(page, main);
  else if (t === 'branding-form')      renderBrandingForm(page, main);
  else if (t === 'activity-timeline')  renderActivityTimeline(page, main);
  else if (t === 'analytics-charts')   renderAnalyticsCharts(page, main);
  else if (t === 'risk-flags')         renderRiskFlags(page, main);
  else if (t === 'users-manage')       renderUsersManage(page, main);
  else if (t === 'commissions-detail') renderCommissionsDetail(page, main);
  else if (t === 'programs-manage')    renderProgramsManage(page, main);
  else if (t === 'student-list')       renderStudentList(page, main);
  else if (t === 'sponsor-students')   renderSponsorStudents(page, main);
  else if (t === 'payments-history')   renderPaymentsHistory(page, main);
  else if (t === 'doc-requirements')   renderDocRequirements(page, main);
  else if (t === 'first-session')      renderFirstSession(page, main);
  else if (t === 'blocked-page')       renderBlockedPage(page, main);
  else if (t === 'under-final-review') renderUnderFinalReview(page, main);
  else if (t === 'cert-sharing')       renderCertSharing(page, main);

/* ── Render sidebar nav ── */
function renderNav(roleId) {
  var items = NAV[roleId];
  var list = document.getElementById('navList');
  while (list.firstChild) list.removeChild(list.firstChild);
  var lastGroup = null;

  items.forEach(function(item, idx) {
    if (item.group && item.group !== lastGroup) {
      lastGroup = item.group;
      var sepLi = el('li'); sepLi.appendChild(el('div', 'group-sep'));
      list.appendChild(sepLi);
      var glLi = el('li');
      glLi.appendChild(txt(el('div', 'group-label'), item.group.toUpperCase()));
      list.appendChild(glLi);
    }

    var li = el('li');
    var a = el('a', 'nav-link' + (idx === 0 ? ' active' : ''));
    a.href = '#';

    var iconWrap = el('span', 'nav-icon');
    iconWrap.appendChild(svgIcon(ICONS[item.icon] || ICONS.overview));
    a.appendChild(iconWrap);

    a.appendChild(txt(el('span'), item.label));

    if (item.badge > 0) {
      var bdg = el('span', 'nav-badge');
      bdg.textContent = item.badge > 9 ? '9+' : String(item.badge);
      a.appendChild(bdg);
    }

    a.addEventListener('click', function(e) {
      e.preventDefault();
      list.querySelectorAll('.nav-link').forEach(function(n) { n.classList.remove('active'); });
      a.classList.add('active');
      renderPage(roleId, item.label);
    });

    li.appendChild(a);
    list.appendChild(li);
  });
}

function getPage(roleId, label) {
  var stateId = currentStates[roleId] || 'default';
  var roleOverrides = STATE_OVERRIDES[roleId];
  if (roleOverrides) {
    var stateOverride = roleOverrides[stateId];
    if (stateOverride && stateOverride[label]) return stateOverride[label];
  }
  return PAGES[roleId] && PAGES[roleId][label];
}

    b.classList.toggle('active', b.dataset.state === stateId);

    var stateEntry = null;

function buildStatePicker(roleId) {
  var sp = document.getElementById('statePicker');
  while (sp.firstChild) sp.removeChild(sp.firstChild);

  var states = ROLE_STATES[roleId];
  if (!states || !states.length) return;

  var activeStateId = currentStates[roleId] || states[0].id;
  var lastGroup = null;
  states.forEach(function(s) {
    if (s.group !== lastGroup) {
      lastGroup = s.group;
      sp.appendChild(txt(el('span', 'spill-group-label'), s.group));
    }
    var btn = el('button', 'spill' + (s.id === activeStateId ? ' active' : ''));
    btn.dataset.state = s.id;
    btn.dataset.role  = roleId;
    btn.textContent = s.label;
    btn.addEventListener('click', function() { setState(roleId, s.id); });
    sp.appendChild(btn);
  });
}

  var ta = document.getElementById('topbarAvatar');
  ta.textContent = role.initials; ta.style.background = role.accent;

  var bellMount = document.getElementById('notifBellMount');
  while (bellMount.firstChild) { bellMount.removeChild(bellMount.firstChild); }
  bellMount.appendChild(buildNotifBell());

  renderNav(roleId);
  renderPage(roleId, NAV[roleId][0].label);

  /* Always show state picker — all roles have states */
  var sp = document.getElementById('statePicker');
  sp.classList.add('visible');
  buildStatePicker(roleId);

  document.querySelectorAll('.rpill').forEach(function(b) {
    b.classList.remove('active');
    b.style.background = 'transparent';
    b.style.borderColor = '#3a3a3a';
    b.style.color = 'rgba(255,255,255,0.55)';
  });
  var activeBtn = document.getElementById('rpill-' + roleId);
  if (activeBtn) {
    activeBtn.classList.add('active');
    activeBtn.style.background = role.accent;
    activeBtn.style.borderColor = role.accent;
    activeBtn.style.color = '#fff';
  }
}

/* ── Build role picker ── */
var picker = document.getElementById('rolePicker');
ROLES.forEach(function(r) {
  var btn = el('button', 'rpill');
  btn.id = 'rpill-' + r.id;
  btn.textContent = r.label;
  btn.addEventListener('click', function() { setRole(r.id); });
  picker.appendChild(btn);
});

/* ── Demo: session timeout trigger ── */
(function() {
  var demoBtn = el('button', '');
  demoBtn.style.cssText = 'position:fixed;bottom:20px;right:20px;z-index:9999;background:#374151;color:#fff;padding:8px 14px;border-radius:8px;font-size:12px;border:none;cursor:pointer;opacity:0.7;';
  txt(demoBtn, 'Demo: Session timeout');
  demoBtn.onclick = function() { showSessionTimeoutSheet(30); };
  document.body.appendChild(demoBtn);
})();

/* ── Init ── */
setRole('student');
</script>
</body>
</html>
